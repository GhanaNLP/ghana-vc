name: build image

on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'src/**', 'pyproject.toml', '.github/workflows/docker.yml']
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Published under the GhanaOpenAI org, where public packages are enabled.
  # Cross-org publishing needs a PAT with write:packages in GhanaOpenAI, stored
  # as the GHCR_TOKEN repo secret; GITHUB_TOKEN only covers this repo's own org.
  IMAGE: ghanaopenai/ghana-vc

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The CUDA base plus a baked-in checkpoint is large; reclaim runner disk.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Check GHCR_TOKEN is present
        run: |
          if [ -z "${{ secrets.GHCR_TOKEN }}" ]; then
            echo "::error::GHCR_TOKEN secret is not set. Create a PAT with"\
                 "write:packages access to GhanaOpenAI and add it as GHCR_TOKEN."
            exit 1
          fi

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
