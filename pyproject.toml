[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghana-vc"
version = "0.1.0"
description = "Convert any Hugging Face audio dataset into the Twi Zephyr voice"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ghana NLP" }]
keywords = ["voice-conversion", "twi", "akan", "ghana", "speech", "seed-vc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Intended Audience :: Science/Research",
]

# torch / torchaudio / librosa are deliberately NOT pinned here. Seed-VC ships
# its own requirements.txt and installs them on first use; declaring our own
# versions installs a second, different torch build and the mismatched CUDA
# runtime then breaks torchaudio with "libcudart.so.12: cannot open shared
# object file". Let Seed-VC own the torch stack.
dependencies = [
    "datasets>=2.18",
    "huggingface_hub>=0.23",
    "soundfile>=0.12",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
ghana-vc = "ghana_vc.cli:main"

[project.urls]
Homepage = "https://github.com/GhanaNLP/ghana-vc"
Model = "https://huggingface.co/ghanaopenai/ghana-vc"
Issues = "https://github.com/GhanaNLP/ghana-vc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
