[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ghana-vc"
version = "0.1.0"
description = "Voice conversion for Ghanaian languages — Twi-trained, transfers cross-lingually"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Ghana NLP" }]
keywords = ["voice-conversion", "twi", "akan", "ghana", "speech", "seed-vc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Intended Audience :: Science/Research",
]

# torch / torchaudio / librosa are deliberately NOT pinned here. Seed-VC ships
# its own requirements.txt and installs them on first use; declaring our own
# versions installs a second, different torch build and the mismatched CUDA
# runtime then breaks torchaudio with "libcudart.so.12: cannot open shared
# object file". Let Seed-VC own the torch stack.
#
# numpy IS pinned, to match Seed-VC's own `numpy==1.26.4`. Without this we
# install numpy 2.x first (along with datasets/pyarrow wheels built against
# it), Seed-VC then downgrades numpy to 1.26.4, and those wheels fail with
# "ModuleNotFoundError: No module named 'numpy.strings'".
# datasets is held on the 2.x line on purpose. 3.x/4.x reach for newer
# huggingface_hub symbols (XetDownloadProgressReporter), and upgrading the Hub
# to satisfy them breaks Seed-VC's BigVGAN, which calls the older Hub API.
dependencies = [
    "datasets>=2.18,<3",
    "huggingface_hub>=0.28.1,<0.34",
    "soundfile>=0.12",
    "numpy>=1.26,<2",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
ghana-vc = "ghana_vc.cli:main"

[project.urls]
Homepage = "https://github.com/GhanaNLP/ghana-vc"
Model = "https://huggingface.co/ghanaopenai/ghana-vc"
Issues = "https://github.com/GhanaNLP/ghana-vc/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
